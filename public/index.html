<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Joining Cleave Group</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f5f5f7; color: #1d1d1f; text-align: center; }
        .container { padding: 20px; }
        .btn { display: inline-block; background: #0071e3; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cleave Group Invite</h1>
        <p>You've been invited to join a group! If the app didn't open automatically, click the button below.</p>
        <a href="#" id="openApp" class="btn">Open Cleave App</a>
    </div>
    <script>
        // Fallback: If they click the button, try the custom scheme
        document.getElementById('openApp').onclick = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var id = urlParams.get('id');
            var key = urlParams.get('key');
            var name = urlParams.get('name');
            var user = urlParams.get('user');

            if (id && key) {
                window.location.href = "cleave://join?id=" + id + "&key=" + key + "&name=" + encodeURIComponent(name) + "&user=" + encodeURIComponent(user);
            }
            return false;
        };
    </script>
</body>
</html>
